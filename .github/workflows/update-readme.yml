name: Update Portfolio README
on:
  push:
    branches: [ main ]
jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Profile Repo
        uses: actions/checkout@v3

      - name: Copy README to Portfolio Repo
        run: |
          git clone https://github.com/ortizdelgadojohanjose04-ai/ortizdelgadojohanjose04-ai.github.io.git portfolio
          cp README.md portfolio/README.md
          cd portfolio
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add README.md
          git commit -m "Auto-update README from profile" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ortizdelgadojohanjose04-ai/ortizdelgadojohanjose04-ai.github.io.git main
